name: Compiler Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/www/**'
      - 'mobile/android-native/**'
      - 'mobile/package*.json'
      - 'mobile/capacitor.config.json'
      - 'mobile/scripts/copy-powerpoint.cjs'
      - 'mobile/scripts/prepare-android.cjs'
      - 'mobile/test-ide-link*.cjs'
      - '.github/workflows/build-android.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - run: npm ci
      - run: node test-ide-link.cjs && node test-ide-link-remembered.cjs
      - run: node scripts/prepare-android.cjs
      - name: Compiler APK de vérification
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: FranceStudent-Android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
