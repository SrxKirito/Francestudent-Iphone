name: Compiler FranceStudent pour SideStore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iphone:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: android-app/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier le projet iPhone
        run: node scripts/verify-iphone.cjs
      - name: Tester l'application
        run: |
          node test-restoration.cjs
          node test-general-settings.cjs
          node test-image-model-settings.cjs
          node test-mcp-wizard.cjs
          node test-projects-activity.cjs
          node test-message-actions.cjs
          node test-mobile-input.cjs
          node test-powerpoint.cjs
      - name: Compiler et créer l'IPA sans certificat Apple
        run: bash scripts/build-iphone.sh
      - name: Fournir l'IPA pour SideStore
        uses: actions/upload-artifact@v7.0.2
        with:
          name: FranceStudent-iPhone-SideStore
          path: android-app/dist/FranceStudent-iPhone.ipa
          if-no-files-found: error
          retention-days: 14
